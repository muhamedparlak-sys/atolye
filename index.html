<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2747A6">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Atölye Kesim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Layout: telefon öncelikli sihirbaz — üstte adım çubuğu, ortada tek iş, altta sabit Geri/Devam çubuğu */
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --ink:#1B2220; --muted:#5C6964; --line:#D3DAD6;
  --accent:#2747A6; --accent-ink:#FFFFFF; --soft:#E3E8F6;
  --wood:#E4D2AE; --wood-edge:#A9864A; --back:#C9D4CF; --back-edge:#6F837B; --top:#8E7B62;
  --warn:#B4541A; --ok:#2E7D4F; --bad:#B3261E;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1A201E; --ink:#E5ECE8; --muted:#97A59F; --line:#2D3633;
  --accent:#8FA8FF; --accent-ink:#0E1430; --soft:#222B45;
  --wood:#5E4E33; --wood-edge:#C9A465; --back:#36433E; --back-edge:#93A9A0; --top:#A48E6E;
  --warn:#F0965A; --ok:#6CC892; --bad:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A201E; --ink:#E5ECE8; --muted:#97A59F; --line:#2D3633;
  --accent:#8FA8FF; --accent-ink:#0E1430; --soft:#222B45;
  --wood:#5E4E33; --wood-edge:#C9A465; --back:#36433E; --back-edge:#93A9A0; --top:#A48E6E;
  --warn:#F0965A; --ok:#6CC892; --bad:#FF8A80; color-scheme:dark}
html{height:100%;box-sizing:border-box}
body{height:100%;display:flex;flex-direction:column;overflow:hidden}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:relative;flex:none;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 0}
.wrap{max-width:720px;margin:0 auto}
.top-row{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
#projName{flex:1;min-width:0;border:0;background:transparent;color:var(--muted);padding:6px 4px;font:500 14px var(--f-body);text-overflow:ellipsis}
#projName:focus{color:var(--ink);background:var(--bg);border-radius:6px}
.icobtn{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.icobtn svg{width:20px;height:20px}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:6px}
.steps button{border:0;background:none;padding:6px 0 9px;color:var(--muted);font:600 11.5px var(--f-body);letter-spacing:.02em;cursor:pointer;border-bottom:3px solid transparent;text-align:center}
.steps button.done{color:var(--ink);border-bottom-color:var(--line)}
.steps button.cur{color:var(--accent);border-bottom-color:var(--accent)}
.steps button:disabled{cursor:default;opacity:.55}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px}
main.fill{overflow:hidden;display:flex;flex-direction:column}
main.fill>.wrap{flex:1;min-height:0;width:100%;display:flex;flex-direction:column}
main .view{gap:12px}
.dz-top{display:flex;gap:6px;align-items:center;flex:none;overflow-x:auto;scrollbar-width:none}
.dz-top .sp{flex:1}
.dz-draw{flex:1;min-height:120px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex}
.dz-draw svg{width:100%;height:100%;display:block;touch-action:manipulation}
.dz-draw .mod,.dz-draw .cell{cursor:pointer}
.dz-bottom{flex:none;max-height:50%;overflow-y:auto;overscroll-behavior:contain;border-radius:14px}
.dz-bottom .editor{border-width:1.5px}
.dz-bottom .editor{padding:12px;gap:10px}
.dz-bottom .editor .grid3{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.dz-bottom .editor .field input{font-size:16px;padding:8px 8px}
.dz-bottom .editor .field .h{font-size:11px}
.sumrow{display:flex;gap:6px;flex-wrap:wrap}
.sumbtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 11px;font:600 13.5px var(--f-body);cursor:pointer;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.sumbtn.w{border-color:var(--warn);color:var(--warn)}
.sumbtn.ok{border-color:var(--ok);color:var(--ok)}
.hint{font-size:12.5px;color:var(--muted);text-align:center}
.carousel{flex:1;min-height:0;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:2px}
.carousel>.vcard{flex:0 0 88%;scroll-snap-align:center;min-height:0;max-width:440px}
.carousel .pic{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.carousel .pic svg{flex:1;min-height:0;width:100%;height:100%;max-height:none}
.carousel .body{flex:none}
.carousel .body p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.otabs{display:flex;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.otabs button{flex:1;border:0;background:var(--surface);color:var(--muted);padding:9px 4px;font:600 13px var(--f-body);cursor:pointer;border-right:1px solid var(--line)}
.otabs button:last-child{border-right:0}
.otabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
h1.c{font-size:24px}
.view{display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.05em;margin:4px 0 0}
.lead{color:var(--muted);margin:-6px 0 0;max-width:60ch}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.tcard span{display:none}.tcard b{font-size:15px!important}.tcard{padding:9px 8px}.tcard svg{width:34px;height:34px}}
.tcard{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:0}
.tcard svg{width:42px;height:42px;color:var(--accent)}
.tcard b{font-size:18px!important}
.tcard b{font:700 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.tcard span{font-size:13px;color:var(--muted)}
.tcard[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.tcard.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:14px}
.bigin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field .k{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:500 18px var(--f-mono);font-variant-numeric:tabular-nums}
.field.big input{font-size:26px;padding:10px 6px;text-align:center}
.field .h{font-size:12px;color:var(--muted)}
.field input:focus{border-color:var(--accent);outline:none}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.plan{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;font:700 16px var(--f-display)}
.plan svg{width:100%;max-width:90px;height:auto}
.plan[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.checks{display:flex;flex-direction:column;gap:2px}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.check small{color:var(--muted);display:block;font-size:12.5px}
.vcard{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.vcard .pic{background:var(--bg);padding:10px;border-bottom:1px solid var(--line)}
.vcard .pic svg{width:100%;height:auto;max-height:210px;display:block}
.vcard .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.vcard b{font:700 21px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.vcard p{margin:0;color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:500 12.5px var(--f-mono);border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--ink);background:var(--bg)}
.tag.w{border-color:var(--warn);color:var(--warn)}
.btn{border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 16px;font:600 15px var(--f-body);cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:7px 11px;font-size:13.5px;border-radius:9px}
.btn.danger{border-color:var(--warn);color:var(--warn);background:transparent}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:600 13.5px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.elev{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
.elev svg{width:100%;height:auto;display:block;max-height:58vh;touch-action:manipulation}
.elev .mod{cursor:pointer}
.elev .cell{cursor:pointer}
.elev .cell:hover{filter:brightness(1.08)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:440px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:700 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.editor{border:1.5px solid var(--accent);border-radius:14px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:12px}
.ed-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ed-head b{font:700 22px var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.ed-head span{color:var(--muted);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:42px}
.row > span{font-size:14.5px}
.step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.step button{width:42px;height:40px;border:0;background:var(--bg);color:var(--ink);font:600 20px var(--f-body);cursor:pointer}
.step output{min-width:40px;text-align:center;font:500 16px var(--f-mono)}
.step input{width:70px;border:0;text-align:center;font:500 16px var(--f-mono);background:var(--surface);color:var(--ink);padding:8px 0}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.pre{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 12.5px var(--f-body);text-align:center}
.pre svg{width:44px;height:58px}
.pre[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
.band{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px dashed var(--line)}
.band:last-child{border:0}
.band-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px}
.adv{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.adv li{display:flex;gap:10px;align-items:flex-start}
.adv .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--f-body);color:var(--surface);margin-top:1px}
.adv .ok .ic{background:var(--ok)}.adv .warn .ic{background:var(--warn)}.adv .info .ic{background:var(--accent)}
.adv details{min-width:0}.adv summary{cursor:pointer;font-size:14.5px}.adv p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
td.id{font-family:var(--f-mono);color:var(--muted)}
td small{display:block;color:var(--muted);font-size:11.5px}
.bnd{display:inline-flex;gap:3px;align-items:center}
.pbox{display:inline-grid;grid-template-columns:12px 34px 12px;grid-template-rows:12px 22px 12px;width:58px;height:46px;position:relative}
.pbox i{grid-column:2;grid-row:2;background:var(--bg);border:1px dashed var(--line);border-radius:2px}
.pbox .edge{border:0;padding:0;background:var(--line);border-radius:3px;cursor:pointer}
.pbox .edge.on{background:var(--warn)}
.pbox .edge.l:first-child{grid-column:2;grid-row:1;margin:3px 0}
.pbox .edge.l:last-child{grid-column:2;grid-row:3;margin:3px 0}
.pbox .edge.s:nth-child(2){grid-column:1;grid-row:2;margin:0 3px}
.pbox .edge.s:nth-child(4){grid-column:3;grid-row:2;margin:0 3px}
.bnd i{display:inline-block;width:14px;height:4px;border-radius:2px;background:var(--line)}
.bnd i.on{background:var(--warn)}
.matbar{display:flex;align-items:center;gap:8px;font-weight:600}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid var(--wood-edge);background:var(--wood);flex:none}
.sw.back{background:var(--back);border-color:var(--back-edge)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.sheet svg{width:100%;height:auto;display:block}
.note{font-size:13px;color:var(--muted)}
.hw{list-style:none;margin:0;padding:0}
.hw li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.hw li:last-child{border:0}
.hw b{font-family:var(--f-mono);font-weight:500;white-space:nowrap}
textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:13px/1.5 var(--f-mono);padding:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:420px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.projects{list-style:none;margin:0;padding:0}
.projects li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.projects li:last-child{border:0}
.projects span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{position:relative;flex:none;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .wrap{display:flex;gap:10px}
.bar .btn{flex:1}
.bar .btn.ghost{flex:0 0 auto;min-width:96px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:14px;z-index:20;max-width:90vw}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.strip-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.strip-h b{font:700 16px var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.strip{position:relative;height:58px;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;margin-bottom:16px;touch-action:pan-y}
.strip .dead{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--line) 0 4px,transparent 4px 9px);font-size:11px;color:var(--muted);display:grid;place-items:center}
.strip .dead.kolon{background:var(--ink);opacity:.75}
.strip .dead.kapi,.strip .dead.bos{background:repeating-linear-gradient(-45deg,var(--warn) 0 3px,transparent 3px 8px);opacity:.6;color:var(--ink);font-weight:600}
.strip .win{position:absolute;top:-1px;height:7px;background:hsl(200 70% 55%);border-radius:2px}
.strip .tick{position:absolute;bottom:-17px;transform:translateX(-50%);font:500 10.5px var(--f-mono);color:var(--muted)}
.strip .tick::before{content:"";position:absolute;left:50%;top:-6px;width:1px;height:5px;background:var(--muted)}
.anc{position:absolute;top:6px;bottom:6px;border-radius:7px;border:2px solid var(--accent);background:var(--soft);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;min-width:8px}
.anc span{font:600 11px var(--f-body);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.anc small{font:500 10.5px var(--f-mono);color:var(--muted)}
.anc.sel{box-shadow:0 0 0 3px var(--accent)}
.anc.clash{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 22%,transparent)}
.anc.dragging{cursor:grabbing;opacity:.85}
.anc-fridge{border-color:hsl(200 60% 45%);background:hsl(200 70% 55% / .2)}
.anc-dish{border-color:hsl(160 50% 38%);background:hsl(160 60% 50% / .2)}
.anc-oven{border-color:hsl(15 70% 48%);background:hsl(15 80% 55% / .2)}
.anc .drain{position:absolute;bottom:3px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:hsl(205 80% 45%)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.swatch{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink);font:500 11px var(--f-body)}

const CARS={hatch:{l:"Hatchback",L:150,W:100,H:75},sedan:{l:"Sedan",L:170,W:95,H:45},sw:{l:"Station wagon",L:180,W:100,H:85},ticari:{l:"Hafif ticari (Doblo, Caddy)",L:180,W:120,H:110},maxi:{l:"Uzun hafif ticari",L:210,W:120,H:120},pick:{l:"Pick-up kasası",L:150,W:145,H:45}};

function carBox(){const c=carOf();return[c.L*10,c.W*10,c.H*10]}
function carDiag(){const[L,W,H]=carBox();return Math.floor(Math.sqrt(L*L+H*H)*.92)}

   <div class="chips wrap">${Object.entries(CARS).map(([k,v])=>`<button class="chip sm" data-carp="${k}" aria-pressed="${c.p===k}">${v.l}</button>`).join("")}</div>

    const n=Math.ceil(p.a0/ml),L=Math.ceil(p.a0/n);

function carHTML(parts,mods){const c=carOf();

function roomPlans(r){const RW=r.RW,RL=r.RL,g=10,items=rmItems(r);

    for(let j=0;j<ny;j++){let prev=0;for(let i=0;i<nx;i++){const c={x:i*g,y:j*g,w:g,h:g};const occ=rects.some(q=>X(c,q));const tmp=dp[i+1];dp[i+1]=occ?0:Math.min(dp[i],dp[i+1],prev)+1;prev=tmp;if(dp[i+1]>best.s)best={s:dp[i+1],x:(i+1-dp[i+1])*g,y:(j+1-dp[i+1])*g}}}

function colFronts(m,ci){const G=R&&R.geo[m.id];if(!G||!G.cols||!G.cols[ci])return null;const c=m.cols[ci],CG=G.cols[ci];

    J.fronts.forEach((f,i)=>{if(f.t==="door"){if(run.length&&run[run.length-1].y1!==f.y0)flush();run.push(f)}else flush()});flush()}));
  const mis=[];const byW={};lines.forEach(l=>(byW[l.wall]=byW[l.wall]||[]).push(l));

async function packStr(obj){const str=JSON.stringify(obj);let bytes=null,v="0";
  if(window.CompressionStream){try{const cs=new CompressionStream("deflate-raw");const w=cs.writable.getWriter();w.write(new TextEncoder().encode(str));w.close();bytes=new Uint8Array(await new Response(cs.readable).arrayBuffer());v="1"}catch(e){bytes=null}}
  if(!bytes)bytes=new TextEncoder().encode(str);let bin="";for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return v+btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
async function unpackStr(s){const v=s[0],b=s.slice(1).replace(/-/g,"+").replace(/_/g,"/");const bin=atob(b+"===".slice((b.length+3)%4)),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  let txt;if(v==="1"){const ds=new DecompressionStream("deflate-raw");const w=ds.writable.getWriter();w.write(u);w.close();txt=await new Response(ds.readable).text()}else txt=new TextDecoder().decode(u);return JSON.parse(txt)}

const JOINTS={

  vida:{label:"Sunta vidası",ins:"sunta vidasıyla",hw:"Sunta vidası 4×50 (gövde)",face:[4,0],edge:[3,40],desc:"En basit bağlantı; ama sunta kenarındaki vida sökülüp takılınca tutmaz. Taşınmayacak dolaplar için."}};

const HK={kv:{l:"Bağlantı deliği",c:"#2747A6"},mf:{l:"Minifix çanağı / kenar deliği",c:"#2747A6"},mb:{l:"Minifix pimi",c:"#2747A6"},kav:{l:"Kavela",c:"#8B4BC4"},pim:{l:"Raf pimi",c:"#2F8A4B"},cup:{l:"Menteşe çanağı",c:"#D2561C"},pl:{l:"Menteşe plakası",c:"#D2561C"},ray:{l:"Çekmece rayı",c:"#0E7C90"},kulp:{l:"Kulp",c:"#A6740B"},rod:{l:"Askı borusu yuvası",c:"#6B7280"},cv:{l:"Çıta / çift kat vidası",c:"#5E7A1E"},kons:{l:"Raf altı taşıyıcı",c:"#B03A5B"}};
function conY(w){w=Math.round(w);return w<=160?[Math.round(w/2)]:w>600?[50,Math.round(w/2),w-50]:[50,w-50]}
function hingePos(h){const k=h<=900?2:h<=1600?3:h<=2000?4:5,out=[];for(let j=0;j<k;j++)out.push(Math.round(100+(h-200)*j/(k-1)));return out}
function drillPlan(mods,R){const t=+SET.t,g=+SET.gap,J=jointOf(),JS=JOINTS[J],FL=floorOf(),push=(S.opener||"kulp")!=="kulp",inst=[];
  const AX={side:{ax:["alttan","önden"],ends:["alt uç","üst uç"],fn:{1:"iç yüz",2:"dış yüz"},lx:"ALT",ly:"ÖN"},
    dik:{ax:["alttan","önden"],ends:["alt uç","üst uç"],fn:{1:"sol yüz",2:"sağ yüz"},lx:"ALT",ly:"ÖN"},
    tab:{ax:["soldan","önden"],ends:["sol uç","sağ uç"],fn:{1:"iç yüz",2:"dış yüz"},lx:"SOL",ly:"ÖN"},
    kus:{ax:["soldan","kenardan"],ends:["sol uç","sağ uç"],fn:{1:"iç yüz",2:"dış yüz"},lx:"SOL",ly:""},
    kap:{ax:["alttan","menteşe kenarından"],ends:["alt","üst"],fn:{1:"iç yüz",2:"dış yüz"},lx:"ALT",ly:"MENTEŞE"},
    on:{ax:["soldan","alttan"],ends:["sol","sağ"],fn:{1:"iç yüz",2:"dış yüz"},lx:"SOL",ly:"ALT"},
    raf:{ax:["soldan","önden"],ends:["sol uç","sağ uç"],fn:{1:"üst yüz",2:"alt yüz"},lx:"SOL",ly:"ÖN"}};
  const P=(mod,name,L,W,ty,mat="sunta")=>{const p={mod:mod.label,name,L:Math.round(L),W:Math.round(W),mat,ty,h:[]};inst.push(p);return p};
  const H=(p,k,x,y,d,dep,s=1,e=null)=>p.h.push({k,x:Math.round(x),y:Math.round(y),d,dep,s,e});
  // f: yüzüne delik açılan parça, g: kenarından bağlanan parça (uç e: "L" baş, "R" son)
  const joint=(f,fx,fs,fys,gp,ge,gys)=>fys.forEach((fy,i)=>{const gy=gys[i],gx=ge==="L"?0:gp.L,gi=ge==="L"?34:gp.L-34,kd=fy>f.W/2?-32:32;
    if(J==="minifix"){H(f,"mb",fx,fy,5,11,fs);H(gp,"mf",gi,gy,15,13,1);H(gp,"mf",gx,gy,8,34,0,ge);
      const ky=fy+kd,kgy=gy+(gy>gp.W/2?-32:32);if(ky>8&&ky<f.W-8&&kgy>8&&kgy<gp.W-8){H(f,"kav",fx,ky,8,12,fs);H(gp,"kav",gx,kgy,8,25,0,ge)}}
    else{H(f,"kv",fx,fy,JS.face[0],0,fs===1&&f.ty!=="dik"?2:fs);H(gp,"kv",gx,gy,JS.edge[0],JS.edge[1],0,ge)}});
  mods.forEach(m=>{if(m.gap||m.panel)return;const G=R.geo[m.id];if(!G||G.panel)return;
    const n=G.cols.length,Hm=m.H,bz=G.bz,supCut=FL.sup&&onFloor(m)&&FL.supM==="derin"?Math.round(FL.supD*10):0,bk=backOf(),D=m.D-supCut,Di=(bk==="18"?m.D-t:m.D)-supCut;
    const walls=[{p:P(m,"Yan dikme",Hm,D,"side"),x0:0,used:[]}];
    for(let k=1;k<n;k++)walls.push({p:P(m,"Ara dikme",Hm-bz-2*t,Di,"dik"),x0:bz+t,used:[]});
    walls.push({p:P(m,"Yan dikme",Hm,D,"side"),x0:0,used:[]});

    const alt=P(m,"Alt tabla",m.W-2*t,D,"tab");let ust=null;
    joint(walls[0].p,bz+t/2,1,conY(D),alt,"L",conY(D));joint(walls[n].p,bz+t/2,1,conY(D),alt,"R",conY(D));

    let tops=[];

      tops=[[kF,[50],[50]],[kB,[50],[Di-50]]]}

    // ara dikmeler
    for(let k=1;k<n;k++){const cx=G.cols[k].x-t/2-t,dk=walls[k].p;
      joint(alt,cx,2,conY(Di),dk,"L",conY(Di));tops.forEach(([tp,fy,gy])=>joint(tp,cx,2,fy,dk,"R",gy))}
    G.cols.forEach((c,i)=>{const WL=walls[i],WR=walls[i+1],sL=fL(i),sR=1;
      const onW=(fn)=>{fn(WL,sL);fn(WR,sR)};
      // ara tablalar
      const sepI={};c.seps.forEach(sp=>{const hc=Hm-sp.y,tb=P(m,sp.name||"Ara tabla",c.sw,Di,"tab");sepI[Math.round(sp.y)]=tb;
        [[WL,sL,"L"],[WR,sR,"R"]].forEach(([w,fs,e])=>{const x=hc-w.x0;let ys=conY(Di);
          if(w.p.ty==="dik"&&w.used.some(u=>Math.abs(u-x)<25))ys=ys.map(y=>Math.min(Di-25,y+30));w.used.push(x);
          joint(w.p,x,fs,ys,tb,e,ys)})});
      c.bands.forEach(b=>{
        const st=b.st||t;
        b.shelvesY.forEach(sy=>{const hp=Hm-(sy+st)-4,lo=Hm-b.ib+8,hi=Hm-b.it-st-8;
          [hp-32,hp,hp+32].filter(v=>v>=lo&&v<=hi).forEach(v=>onW((w,fs)=>[37,Di-37].forEach(y=>H(w.p,"pim",v-w.x0,y,5,10,fs))))});
        if(b.kind==="aski"&&!b.hook&&b.rod!=null)onW((w,fs)=>H(w.p,"rod",Hm-b.rod-w.x0,Di/2,3,10,fs));
        // raf destekleri: çıta, taşıyıcı, çift kat vidaları ve orta dikme bağlantısı
        const sp=b.sup||{};if(b.shelvesY.length&&(sp.on||sp.arka||sp.konsol||sp.kalin||sp.dikme)){const dep=b.dep,L=c.sw,step=n=>{const o=[];const k=Math.ceil((L-100)/150);for(let j=0;j<=k;j++)o.push(50+(L-100)*j/k);return o};
          const sh=b.shelvesY.map(()=>{const p=P(m,sp.kalin?"Raf · çift kat (yapıştırılır)":"Raf",L,dep,"raf",b.rmat||"sunta");
            if(sp.on)step().forEach(x=>H(p,"cv",x,t/2,4,0,1));if(sp.arka)step().forEach(x=>H(p,"cv",x,dep-t/2,4,0,1));

            const below=[b.kind&&b.bot>=Hm-bz-t-1?alt:sepI[Math.round(b.bot)]].concat(sh),above=sh.concat([sepI[Math.round(b.top)]||(b.top<=t+1?ust:null)]);

              const ys=conY(pd).map(y=>Math.min(pd-25,y+(j%2?30:0))),fy=ys.map(y=>y+off);

              if(lo)joint(lo,posOn(lo),1,lo===alt||lo===ust?fy.map(y=>y+2):fy,post,"L",ys);else ys.forEach(y=>H(post,"kv",0,y,JS.edge[0],JS.edge[1],0,"L"));

      const railL=Math.max(250,Math.floor((Di-40)/50)*50);
      c.drawers.forEach(dr=>{const ax=Hm-(dr.y+dr.h)+37;onW((w,fs)=>{for(let y=37;y<=railL-20;y+=128)H(w.p,"ray",ax-w.x0,y,3,10,fs)});

 {d:"21 Ekim 2026 · gece",t:"Kutulu saklama ünitesi",items:[
  ["Kutulu saklama ünitesi","Hazır modellerde yeni: oyuncak kutuları raylara kayan, bölmeli saklama ünitesi. En, yükseklik, derinlik, bölme sayısı ve kademe aralığı ayarlı; hazır ölçüler 99×44×57, 99×44×94, 66×44×94, 132×44×57. Bir levhaya kaç iskelet sığdığını kendisi yazar (99×44×57 düz renkte 3 tane).","hazir"],
  ["Kutu rayı","Alüminyum L profil (metrajı hırdavata), suntalam çıta (kesim listesine) ya da CNC kanal (kanal yükseklikleri hazırlığa yazılır). Arkalık ve duvar gönyesi dahil.",null]]},
 {d:"21 Ekim 2026 · gece",t:"Divan",items:[
  ["Divan","Ana ekranda yeni 'Divan' kartı (Hazır modeller içinde). Sandıklı (amortisörlü kapak), çekmeceli (tekerlekli, bir ya da iki yanda) ya da latalı; şilte ölçüsüne göre kendini kurar. Suntalamdan, yalnız düz kesim.","hazir"],
  ["Başlık","Divana cıvatayla bağlanan başlık; isteğe bağlı kademeli ön panel (farklı desen ya da döşeme) eğimli kesim istemeden sıcak bir görünüm verir.",null],
  ["Ana ekran","Mutfak kartı artık diğer türlerle aynı ızgarada.",null]]},
 {d:"21 Ekim 2026 · akşam",t:"Raflar bel vermesin, kesim listesini düzelt, kulpsuz",items:[
  ["Raf sehimi","Düzen'de rafa dokununca 'Bu raf zamanla kaç mm sarkar' görünür. Hesap malzemeye (suntalam, MDF, kontrplak, masif), rafın boyuna, derinliğine ve yüke (hafif, orta, kitap, ağır) göre yapılır; bel veren raf çizimde kırmızı kesik çizgiyle gösterilir.",null],
  ["Tek dokunuşla destek","Ön çıta, arka çıta, orta dikme, raf altı taşıyıcı ya da kalın (çift kat) raf. Her düğmede eklenince kaç mm'ye ineceği yazar. Eklenen destek kesim listesine, hırdavata, delik planına, montaja ve 3D'ye girer. Düzen → 'Raflar' ekranından bel veren hepsine birden eklenir.",null],
  ["Ağır yük","Ölçü → Zemin ya da Düzen → Raflar: 'Ağır yük taşıyacak' seçilince bel veren raflara destek, gövdeye ön + arka baza ve geniş gövdeye baza ara desteği kendiliğinden eklenir.",null],
  ["Baza sayısı","Sabit bazada 1 (yalnız önde) ya da 2 (önde ve arkada) seçilir; arka baza bantsız kesilir.",null],
  ["Kesim listesini düzelt","Kesim → Parçalar: parça numarasına dokunup ölçüyü, adedi, adı değiştirin ya da parçayı çıkarın; en alttan yeni parça ekleyin. Değişen satır işaretli kalır, 'Tasarıma döndür' ile geri alınır. Kesim planı, etiket, PDF, Excel ve teklif düzeltilmiş listeyi kullanır.",null],
  ["Kulpsuz kapak","Düzen → Kulp ya da Hırdavat: 'Kulpsuz (kanal)'. Alt dolap önleri üstten 3 cm kısalır; suntalam L ve U kanal çıtaları kesim listesine ya da alüminyum gola profil metrajı hırdavata eklenir. Üst dolap kapakları alttan 2 cm taşar.",null]]},
 {d:"21 Ekim 2026",t:"Hazır modeller, çocuk odası, arabama sığsın",items:[
  ["Kapak boylarını eşitle","Düzen'de dolaba dokununca 'Ön yüz' satırı kapak ve çekmece boylarını alttan üste yazar. Üst üste kapaklar farklı boyda ya da yan yana kapak çizgileri hizasızsa uyarır; 'Kapak boylarını eşitle' ve 'Kapak çizgilerini hizala' tek dokunuşla düzeltir (arkadaki ara tabla da kayar).",null],
  ["Gardırop üstü","235 cm üstü gardıropta seçim sizde: ayrı tavan dolabı, tavana kadar tek gövde ya da üstü boş. Taç her zaman isteğe bağlı (Düzen → Taç).",null],
  ["3D adım adım montaj","Hazır modellerde 3D görünüm: parmakla çevirin; ‹ › ile her adımda hangi parçanın takıldığını mavi ve ayrık görün. Üretim kılavuzunda her adımın resmi var.","hazir"],
  ["Ev yatak yenilendi","Latalar metal L profile oturur (istenirse ahşap çıta). Çatı ayrı modül: metal lamalarla takılır, sökülünce çerçeve yatak kalır. Başlık ve ayak ucu paneli, iki yanda korkuluk seçimli.","hazir"],
  ["Hazır modeller","Ana sayfa → Hazır modeller: Montessori ev yatak, Montessori yer yatağı, klasik karyola, ön yüzlü kitaplık, öğrenme kulesi. Şilte ölçüsünü seçin; parça listesi, levha sayısı, hırdavat ve montaj sırası kendiliğinden çıkar. Parçaların çoğu şerit, levhaya sıkı yerleşir.","hazir"],
  ["Üretim kılavuzu (PDF)","Her hazır model için ustaya kılavuz: çizim, malzeme, ebatlama listesi, levha yerleşimi, hırdavat, alet listesi, delik ölçüleri, montaj sırası, yüzey işlemi ve teslim öncesi güvenlik kontrolü. Açılan sayfada Yazdır → PDF olarak kaydet.","hazir"],
  ["Çocuk odası planla","Oda ölçüsü, kapı ve pencereyi girin: yatak, dolap, kitaplık ve oyuncak rafı odaya sığar mı, 3 farklı yerleşim, kalan oyun alanı ve takımın kaç levhadan çıktığı.","hazir"],
  ["Yeni malzemeler","Huş kontrplak, su kontrası, masif yapıştırma panel, ham MDF; levha ölçüsü ve fiyatı Ayarlar'dan. Çocuk odası için malzeme karşılaştırması hazır modellerde.",null],
  ["Birleşim seçimi","Minifix + kavela, karyola cıvatası + kavela ya da vida + kavela + tutkal; hırdavat listesi seçime göre değişir.",null],
  ["Arabama sığsın","Ayarlar → Arabam: aracınızın yükleme ölçüsünü girin. Kesim sonucunda sığmayan parçalar ve nasıl bölüneceği yazar; hazır modellerde uzun parçalar kendiliğinden ek yerli (ek lamı + cıvata) üretilir.",null]]},
 {d:"20 Ekim 2026 · akşam",t:"Levha tasarrufu, müşteri klasörleri, fotoğrafla ölçü",items:[
  ["Daha iyi levha yerleşimi","Her kesim için 190'a yakın yerleşim deneniyor (panel testeresine uygun şerit kesim dahil); en az levhalı olan seçiliyor.",null],
  ["Artıktan ne çıkar?","Kesim → Plakalar ve Ölçüden levha planı: levha sayısını artırmadan artığa sığan hazır ürünler (komodin, banyo dolabı, kitaplık, ayakkabılık, sehpa, kahve köşesi modülü…), kaç adet çıktığı, önerilen satış fiyatı. 'Ekle' ile kesime girer, müşteri teklifine girmez.",null],
  ["Kesim optimizasyonu yenilendi","Levhalar sırayla, her biri en dolu olacak şekilde doldurulur; aynı ölçüdeki parçalar aynı şeride dizilir (panel testeresine uygun 3 aşamalı giyotin kesim); kötü dolan levhadaki parçalara öncelik verilip plan tekrar kurulur. 'En iyisini ara' 15 saniyeye kadar arar. Her levhada kendi doluluk oranı yazar.",null],
  ["3D'yi gönder","3D ekranında 'Paylaş' → 'Bağlantı olarak gönder': WhatsApp'ta bağlantıya dokunan müşteri iPhone'da da Android'de de tarayıcıda açıp çevirir. Ayrıca döndürülebilir 3D sayfa (müşteri tarayıcıda çevirir, ölçüler ve kapak aç/kapa içinde), 3D model dosyası (.glb) ya da resim.",null],
  ["Mutfak cihazları","Eviye, bulaşık, buzdolabı ve ocak tesisat şeridinde üst üste gelmez. Pişirme: ankastre fırın + ocak, set üstü ocak ya da fırın boy dolapta; mikrodalga üst dolapta, boy dolapta ya da tezgahta.",null],
  ["Bu modülde ne var?","Düzen'de mutfak dolabına dokunun: dolap, çekmeceli, eviye, bulaşık, ocak, boy dolap, buzdolabı; üst dolapta açık raf, mikrodalga nişi, davlumbaz. Ocak konunca üstü davlumbaz olur.",null],
  ["Öneri ayrıntısı","Öneri kartına dokunun: tüm duvarlar büyük ve yakınlaştırılabilir, levha, fiyat, cihazlar ve uyarılar tek ekranda.",null],
  ["Kendim karar vereceğim","Kesim → Plakalar: her parça için 'boyu kaç mm kısalırsa levha düşer' ve bunun dolapta neye denk geldiği; Düzen'de aç ile değişikliği kendiniz yapın, 'Artıktan keseceğim' ile parçayı levha planından çıkarın. Düzen'deki sayaç gereken levhayı da gösterir (5 gövde (4,1)).",null],
  ["Levha azaltma önerileri","Kesim → Plakalar: son levha az doluysa 'Son levhayı kurtar'. Raf 1–2 cm sığ, derinlik 1 cm az, boy 2 cm kısa gibi küçük değişikliklerden levha düşürenler listelenir; tek dokunuşla uygulanır.",null],
  ["3D'de ölçüler","3D görünümde modül genişlikleri, toplam en, boy ve derinlik; perspektif, önden, yandan, üstten görünüm.",null],
  ["Müşteri klasörleri","Projeler sayfasında her müşteriye klasör: içindeki tüm mobilyalar, her birinin modül listesi, toplu müşteri teklifi ve klasörü dosya olarak indirme.","proj"],
  ["Fotoğrafla ölçü","Duvara A4 kağıt yapıştırıp ya da metre şeridi, kart, anahtar gibi ölçüsü bilinen bir şeyle fotoğraf çekin; noktaları sürükleyip ölçün, ölçüyü projeye aktarın.","foto"]]},
 {d:"20 Ekim 2026",t:"Hızlı fiyat ve mutfak yenileme",items:[
  ["Hızlı fiyat","Dolabın kendi ölçüsünü yazın, bölme-çekmece-raf sayısını seçin: levha sayısı, yerleşim planı ve fiyat hemen çıkar. Birden çok dolap tek teklifte toplanır.","hizli"],
  ["Dolap mı duvar mı?","Gardırop ve diğer mobilyalarda girdiğiniz ölçünün dolabın kendisi mi, duvar arası mı olduğunu seçin; duvar seçilirse montaj payı düşülür.",null],
  ["Eviye sabit","Eviyeyi giderin önüne çektiğinizde artık o yerinde kalır; buzdolabı ve diğer cihazlar kenara kayar. Köşeye yaklaşınca köşe dolabı yerine kör köşe bırakılır.",null],
  ["Mutfak yenileme","Eviyesiz dolap sırası (karşı duvar, kiler), 'Tezgah mevcut, değişmeyecek' ve 'Üst dolap yapılmayacak' seçenekleri: Mutfak → Ölçü → Cihaz.",null],
  ["Ölçüden levha planı","Tasarım yapmadan parça ölçülerini yazın; levha yerleşimi çıkar, fasoncuya PDF, Excel ya da mesaj olarak gönderin.","liste"],
  ["Taç","Düzen ekranında 'Taç': kuşaklı taç, profilli taç ya da tavana kapama. Parçalar kesim listesine eklenir.",null],
  ["Kapağı bölme","Gövdeye dokunun → 'Kapak: Tek boy / 2 parça / 3 parça'. Ayrım yüksekliği yerden cm olarak girilebilir.",null],
  ["İki kademeli üst dolap","Mutfakta üst dolap tavana kadar iki sıra; üst kademe derin yapılırsa altına LED çekilir.",null]]},
 {d:"18 Ekim 2026",t:"Atölye çıktıları",items:[
  ["Bölme genişlikleri","Askı bölmesi geniş, raf bölmesi dar gelir. Gövdeye dokunup ara dikmeyi parmakla kaydırın.",null],
  ["Tezgah üstü","Niş rafı, cihaz dolabı, askı rayı ve tezgah arası kaplama (mutfak ve kahve köşesi).",null],
  ["Delik planı","Konfirmat, minifix ya da vida seçin; her parçanın delikleri ölçülü çizilir, yazdırılır.",null],
  ["Parça etiketleri","A4 etiket kağıdına ya da termal yazıcıya: parça no, ölçü, plaka, bant kenarları, delik kodu.",null]]},
 {d:"17 Ekim 2026",t:"Fiyat ve montaj",items:[
  ["Fiyat kütüphanesi","Plaka, bant, ebatlama ve hırdavat fiyatlarını bir kez girin (üstteki ₺); her projede kullanılır.","lib"],
  ["Montaj şeması ve 3D","Kesimden sonra adım adım montaj ve parmakla çevrilen 3D görünüm.",null],
  ["Bant, süpürgelik, ayak","Her kenarın bandı tek tek açılıp kapanır; süpürgelik payı ve plastik/metal ayak seçilir.",null]]},
 {d:"Daha önce",t:"Temel özellikler",items:[
  ["Mutfak planlayıcı","Oda ölçüsü, kapı ve pencereden I/L/U plan önerileri; kapı ve kapak açılma alanları denetlenir.",null],
  ["Ergonomi uyarıları","Raf aralığı, askı boyu, kapak boyu ve menteşe sayısı standartlara göre denetlenir.",null],
  ["Teklif","İşçilik, kâr, nakliye ve KDV ile müşteriye gönderilecek teklif metni.",null]]}];

  ["Düzen","Duvar düğmeleriyle (A, B, C) duvarlar arasında geçin. 'Tezgah üstü' ile niş rafı ya da cihaz dolabı ekleyin."]]},

 {k:"liste",t:"Ölçüden levha planı",go:{view:"liste"},steps:[

  ["Gönder","Levha yerleşimi altta çıkar. Kesim planı (PDF), Excel (CSV) ya da metin olarak fasoncuya gönderin."]]},
 {k:"musteri",t:"Müşteri klasörleri",go:{view:"proj"},steps:[
  ["Klasör","Projeler (klasör simgesi) → Açık proje → 'Müşteri / klasör' alanına müşterinin adını yazıp Kaydet."],
  ["Mobilya ekle","Klasörün altındaki '+ Bu müşteriye mobilya' ile aynı müşteriye yeni proje açın; her proje kendi modülleriyle görünür."],
  ["Teklif","'Müşteri teklifi' tüm mobilyaların fiyatını toplar; kopyalayıp gönderin. 'Klasörü indir' ile yedekleyin ya da başka telefona taşıyın."]]},
 {k:"fiyat",t:"Fiyatlar ve teklif",go:{view:"lib"},steps:[
  ["Fiyat kütüphanesi","Üstteki ₺ düğmesi: plaka, bant, ebatlama, menteşe, ray, kulp fiyatlarını bir kez girin. '…' olan kalemlerde fiyat tüm boylara uygulanır."],
  ["Teklif","Kesim → Teklif: işçilik, kâr, nakliye, KDV ve yuvarlama. Bu oranlar tüm projelerde ortaktır."],
  ["Yedek","Projeler sayfasından 'Yedeği indir': tüm projeler, fiyatlar ve listeler tek dosyada. Telefon değiştirirken geri yükleyin."]]},
 {k:"atolye",t:"Kesim, etiket, delik",go:null,steps:[
  ["Etiket","Kesim → Etiket: A4 24'lü kağıda yazdırın; parçalar kesimden çıkınca plaka sırasıyla yapıştırın."],
  ["Delik","Kesim → Delik: bağlantı tipini seçin (sahada konfirmat pratik). Her parçanın delikleri ölçülü çizilir; yazdırıp parçanın yanında tutun."],
  ["Montaj","Montaj şeması hangi parçanın hangi sırayla takılacağını gösterir."],
  ["Listeyi düzelt","Kesim → Parçalar: parça numarasına (✎) dokunun; ölçü, adet, ad değiştirin ya da çıkarın. '+ Parça ekle' ile elle parça ekleyin. Değişen satır renkli görünür; 'Tasarıma döndür' ile geri alınır."]]},
 {k:"magaza",t:"Mağaza (müşteri sitesi)",go:null,steps:[
  ["Fiyatlar","Önce ₺ düğmesinden plaka, bant ve hırdavat fiyatlarını, Kesim → Teklif'ten işçilik, kâr ve KDV'yi girin."],
  ["Bağlantı","Ana ekran → 'Mağaza (müşteri sitesi)': mağaza adı, WhatsApp numarası, satışa açık ürünler, peşin indirimi. 'Mağaza bağlantısını oluştur' → Kopyala ya da Paylaş."],
  ["Müşteri","Müşteri ürünü seçer, ölçüsünü yazar, düzeni ve rengi seçer, fiyatı görür, 'WhatsApp'tan sipariş ver'e dokunur."],
  ["Sipariş","Gelen mesajdaki 'Tasarım' bağlantısını açın → 'Atölyede aç'. Tasarım projelerinize eklenir; ölçüyü müşteriyle teyit edip kesime geçin."]]},
 {k:"raf",t:"Raflar bel vermesin",go:null,steps:[
  ["Bakın","Düzen'de raflı göze dokunun: 'Bu raf zamanla X mm sarkar' kutusu yeşilse sağlam, turuncuysa az sarkar, kırmızıysa bel verir."],
  ["Yük ve malzeme","Rafa ne konacağını (hafif, orta, kitap, ağır yük) ve raf malzemesini seçin; hesap hemen değişir."],
  ["Destek","Ön çıta en ucuz çözüm; orta dikme en etkilisi. Her düğmede eklenince kaç mm'ye ineceği yazar. 'Önerilen desteği ekle' en uygun olanı seçer."],
  ["Hepsi birden","Düzen'deki 'Raflar' düğmesi bütün rafları listeler; 'Ağır yük taşıyacak' seçilirse destek ve çift baza kendiliğinden eklenir."]]},
 {k:"foto",t:"Fotoğrafla ölçü",go:{view:"foto"},steps:[
  ["Referans","Ölçülecek duvara A4 kağıt yapıştırın ya da metre şeridini 1 m açıp duvara tutturun (en doğrusu). Kart, cetvel, anahtar da olur; anahtarın boyunu girin."],
  ["Fotoğraf","Telefonu duvara paralel tutup karşıdan çekin; referans fotoğrafta iri görünsün."],
  ["Noktalar","Mavi noktaları referansın köşelerine (A4'te 1-2-3-4: sol üst, sağ üst, sağ alt, sol alt), turuncu çizginin uçlarını ölçülecek yere sürükleyin; üstte büyüteç açılır."],

function qhMod(it,x0){const W=Math.round(it.W*10),H=Math.round(it.H*10),D=Math.round(it.D*10),n=Math.max(1,Math.min(6,it.bolme|0)),role=it.tip==="alt"?"alt":it.tip==="ust"?"ust":"govde";
  const cek=Math.max(0,it.cek|0),raf=Math.max(0,it.raf|0),kp=!!it.kapak,cols=[];
  for(let i=0;i<n;i++){let bands,p="raf";
    if(it.tip==="gardirop"&&i<Math.min(n,it.aski|0)){p="aski";bands=[];if(i===0&&cek)bands.push(B("cekmece",Math.min(cek,4)*180,{n:cek}));bands.push(B("aski",0,{door:kp}));bands.push(B("raf",350,{door:kp,join:true}))}
    else if(it.tip==="komodin"||(cek>=3&&i===0&&it.tip!=="gardirop"))bands=[B("cekmece",0,{n:Math.max(1,cek)})];
    else if(cek&&i===0)bands=[B("raf",0,{door:kp,shelves:raf}),B("cekmece",cek*170,{n:cek})];
    else bands=[B("raf",0,{door:kp,shelves:raf,use:it.tip==="kitaplik"?"kitap":undefined})];
    cols.push({p,bands})}
  const m=mkMod({role,x:x0,mount:0,W,H,D,baza:role==="ust"?0:80,rails:it.tip==="alt",cols});m.label=(QT[it.tip].l.split(" ")[0]).slice(0,3).toUpperCase();
  if(n>1&&it.tip==="gardirop")recWidths(m);return m}
function qhCalc(){const save=S,saveR=R;
  try{const ck=Object.keys(COLORS);S=Object.assign(freshState(),{type:"gardirop",back:QH.back||"3",colors:{body:null,front:QH.front?ck[0]:null,panels:false},floor:{sup:false,supH:8,supD:1.5,supM:"kert",foot:"baza",footH:+QH.baza||8},opener:"kulp"});
    let x=0;const mods=[];QH.items.forEach(it=>{for(let k=0;k<Math.max(0,it.adet|0);k++){const m=qhMod(it,x);mods.push(m);x+=m.W+100}});
    S.mods=mods;R=computeAll(mods);const parts=R.parts,packs=matsUsed(parts).map(k=>({k,P:pack(parts,k)}));
    const q=mods.length?quote():null,adv=mods.length?advise(mods,R).filter(a=>a.lvl==="warn").concat(R.err.map(e=>({txt:e.m+": "+e.txt}))):[];
    const sheets=packs.map(({k,P})=>`<div class="matbar"><span class="sw ${k!=="sunta"&&k!=="kapak"?"back":""}"></span>${esc(SET.mats[k].name)} · ${P.sheets.length} levha · fire %${fmt(P.fire*100)}</div>`+P.sheets.map((sh,i)=>`<div class="sheet"><span class="lbl">Levha ${i+1}/${P.sheets.length}</span>${sheetSVG(sh,P.m,k)}</div>`).join("")).join("");
    const doors=Object.values(R.geo).reduce((s2,G)=>s2+(G.cols||[]).reduce((q2,c)=>q2+c.doors.length,0),0),drw=Object.values(R.geo).reduce((s2,G)=>s2+(G.cols||[]).reduce((q2,c)=>q2+c.drawers.length,0),0);
    return{mods,parts,packs,q,adv,sheets,doors,drw,band:R.band,hw:mods.length?hardware(mods,R):[]}}
  finally{S=save;R=saveR}}

function slug(t){return (t||"proje").toLocaleLowerCase("tr").replace(/ç/g,"c").replace(/ğ/g,"g").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ş/g,"s").replace(/ü/g,"u").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"proje"}
function resolveVars(svg){const cs=getComputedStyle(document.documentElement);
  return svg.replace(/var\(--([\w-]+)\)/g,(m,k)=>cs.getPropertyValue("--"+k).trim()||"#888")}
function loadSvg(svg,w){return new Promise((res,rej)=>{
  const vb=(svg.match(/viewBox="([^"]+)"/)||[])[1].split(/\s+/).map(Number);const h=Math.round(w*vb[3]/vb[2]);
  const str=resolveVars(svg).replace("<svg",`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"`).replace(/ style="[^"]*"/,"");
  const img=new Image();img.onload=()=>res({img,w,h});img.onerror=rej;img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(str)})}
async function drawingPNG(){
  const kitchen=S.type==="mutfak";R=computeAll(S.mods);
  const walls=kitchen?(S.inp.plan==="I"?["A"]:S.inp.plan==="L"?["A","B"]:["A","B","C"]):["A"];
  const parts=[];const W=1600;
  if(kitchen)parts.push({cap:"Plan",svg:planSVG(S.mods,false),w:900});
  walls.forEach(w=>parts.push({cap:kitchen?w+" duvarı":"",svg:wallSVG(S.mods,R,w,{grid:S.grid})}));
  const imgs=[];for(const p of parts)imgs.push({...p,...await loadSvg(p.svg,p.w||W-80)});
  const cs=getComputedStyle(document.documentElement),col=k=>cs.getPropertyValue("--"+k).trim();
  const head=150,gapH=70,foot=60;const H=head+imgs.reduce((q,i)=>q+i.h+gapH,0)+foot;
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle=col("surface");x.fillRect(0,0,W,H);
  x.fillStyle=col("ink");x.font="700 56px 'Barlow Condensed', 'Arial Narrow', sans-serif";x.fillText(S.name.toLocaleUpperCase("tr"),40,80);
  x.fillStyle=col("muted");x.font="500 28px 'IBM Plex Sans', sans-serif";
  const sub=kitchen?`${TYPES.mutfak.label} · ${S.inp.plan} plan · tezgah ${S.inp.tezgah} cm`:`${TYPES[S.type].label} · ${S.inp.W} × ${S.inp.H} × ${S.inp.D} cm`;
  x.fillText(sub+" · arkalık "+BACKS[backOf()].short,40,124);
  let y=head;imgs.forEach(i=>{if(i.cap){x.fillStyle=col("ink");x.font="700 32px 'Barlow Condensed', sans-serif";x.fillText(i.cap.toLocaleUpperCase("tr"),40,y+30)}
    x.drawImage(i.img,(W-i.w)/2,y+44,i.w,i.h);y+=i.h+gapH});
  x.fillStyle=col("muted");x.font="400 22px 'IBM Plex Sans', sans-serif";
  x.fillText((S.grid?"Ölçüler cm · her göz: genişlik × yükseklik":"Ölçüler cm")+" · "+new Date().toLocaleDateString("tr-TR"),40,H-24);
  return new Promise(r=>c.toBlob(b=>r(b),"image/png"))}

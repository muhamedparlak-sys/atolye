<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>3D tasarım — 3D</title>
<style>html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f4f2ee;overflow:hidden}#c{position:fixed;inset:0}#bar{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;padding:10px 12px;align-items:center;flex-wrap:wrap;background:linear-gradient(#f4f2eeee,#f4f2ee00)}#bar b{flex:1;font-size:17px;color:#16181d}
button{border:1px solid #c9ccd3;background:#fff;color:#16181d;border-radius:999px;padding:8px 13px;font:600 13px Arial}button.on{background:#2747A6;color:#fff;border-color:#2747A6}#hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#6b6f78;font-size:12px}#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;color:#444}</style></head>
<body><div id="c"></div><div id="bar"><b>3D tasarım</b><button id="bd" class="on">Ölçüler</button><button id="bo">Kapaklar kapalı</button><button id="bf">Önden</button><button id="bp" class="on">Perspektif</button></div><div id="hint">Döndürmek için sürükleyin · iki parmakla yakınlaştırın · </div><div id="err">3D için internet bağlantısı gerekiyor. Bağlanıp sayfayı yenileyin.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>let D=null;function start(){
if(!window.THREE||!THREE.OrbitControls){document.getElementById("err").style.display="flex"}else{
const el=document.getElementById("c"),rd=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});rd.setPixelRatio(Math.min(devicePixelRatio||1,2));el.appendChild(rd.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color("#f4f2ee");const cam=new THREE.PerspectiveCamera(38,1,20,200000),ct=new THREE.OrbitControls(cam,rd.domElement);ct.enableDamping=true;ct.maxPolarAngle=Math.PI*.52;
sc.add(new THREE.HemisphereLight(0xffffff,0x8a8172,.85));const dl=new THREE.DirectionalLight(0xffffff,.55);dl.position.set(3000,6000,5000);sc.add(dl);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(40000,40000),new THREE.MeshLambertMaterial({color:0xDCD7CC}));fl.rotation.x=-Math.PI/2;fl.position.y=-1;sc.add(fl);
let G=null,DG=null;const em=new THREE.LineBasicMaterial({color:0x2a2a2a,transparent:true,opacity:.28}),mc={};const mat=(c,o)=>mc[c+o]||(mc[c+o]=new THREE.MeshLambertMaterial({color:new THREE.Color(c),transparent:o<1,opacity:o}));
function build(list){if(G)sc.remove(G);G=new THREE.Group();list.forEach(b=>{const g=new THREE.BoxGeometry(b[1]-b[0],b[3]-b[2],b[5]-b[4]),m=new THREE.Mesh(g,mat(b[6],b[7]));m.position.set((b[0]+b[1])/2,(b[2]+b[3])/2,(b[4]+b[5])/2);G.add(m);if(!b[8]){const e=new THREE.LineSegments(new THREE.EdgesGeometry(g),em);e.position.copy(m.position);G.add(e)}});sc.add(G)}
function dims(){DG=new THREE.Group();const lm=new THREE.LineBasicMaterial({color:0xC2410C,depthTest:false,transparent:true}),U=D.dims.U;
 D.dims.lines.forEach(l=>{const L=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(l[0],l[1],l[2]),new THREE.Vector3(l[3],l[4],l[5])]),lm);L.renderOrder=19;DG.add(L)});
 D.dims.labels.forEach(([t,x,y,z])=>{const c=document.createElement("canvas");c.width=256;c.height=96;const g=c.getContext("2d");g.fillStyle="rgba(255,255,255,.92)";g.strokeStyle="#C2410C";g.lineWidth=5;g.beginPath();g.moveTo(18,4);g.arcTo(252,4,252,92,18);g.arcTo(252,92,4,92,18);g.arcTo(4,92,4,4,18);g.arcTo(4,4,252,4,18);g.closePath();g.fill();g.stroke();g.fillStyle="#9A3412";g.font="bold 58px Arial";g.textAlign="center";g.textBaseline="middle";g.fillText(t,128,50);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));sp.scale.set(U*1.25,U*.47,1);sp.position.set(x,y,z);sp.renderOrder=20;DG.add(sp)});sc.add(DG)}
function fit(front){const bb=new THREE.Box3().setFromObject(G),c=bb.getCenter(new THREE.Vector3()),s=bb.getSize(new THREE.Vector3()),asp=innerWidth/innerHeight,t=Math.tan(19*Math.PI/180),r=Math.max(s.y/(2*t),Math.max(s.x,s.z)/(2*t*asp))*1.25+Math.max(s.x,s.z)*.5;if(front)cam.position.set(c.x,c.y+r*.05,c.z+r*1.35);else cam.position.set(c.x+r*.55,c.y+r*.38,c.z+r*.95);ct.target.copy(c);ct.update()}
const size=()=>{rd.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()};addEventListener("resize",size);size();
let open=false;build(D.closed);dims();fit(false);
(function loop(){ct.update();rd.render(sc,cam);requestAnimationFrame(loop)})();
const $=i=>document.getElementById(i);
$("bd").onclick=()=>{DG.visible=!DG.visible;$("bd").classList.toggle("on",DG.visible)};
$("bo").onclick=()=>{open=!open;build(open?D.open:D.closed);$("bo").textContent=open?"Kapaklar açık":"Kapaklar kapalı";$("bo").classList.toggle("on",open)};
$("bf").onclick=()=>{fit(true);$("bf").classList.add("on");$("bp").classList.remove("on")};$("bp").onclick=()=>{fit(false);$("bp").classList.add("on");$("bf").classList.remove("on")}}
}
(async()=>{try{const h=location.hash.slice(1),v=h[0],b=h.slice(1).replace(/-/g,'+').replace(/_/g,'/');const bin=atob(b+'==='.slice((b.length+3)%4)),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);let txt;if(v==='1'){const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(u);w.close();txt=await new Response(ds.readable).text()}else txt=new TextDecoder().decode(u);const c=JSON.parse(txt);const P=c.p,ex=b=>[b[0],b[1],b[2],b[3],b[4],b[5],P[b[6]],b[7]/100,b[8]];const cl=c.b.map(ex),op=c.f?[]:cl.slice();(c.o||[]).forEach(([i,...bb])=>{if(i<0)op.push(ex(bb));else op[i]=ex(bb)});D={name:c.n,closed:cl,open:op,dims:c.d,date:c.t};document.title=c.n+' — 3D';document.querySelector('#bar b').textContent=c.n;document.getElementById('hint').textContent='Döndürmek için sürükleyin · iki parmakla yakınlaştırın · '+c.t;start()}catch(e){const er=document.getElementById('err');er.textContent='Bağlantı eksik ya da bozuk; tasarımı gönderen kişiden yeniden isteyin.';er.style.display='flex'}})();</script></body></html>
